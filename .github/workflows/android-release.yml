name: Signed Ravyn release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing release signing secrets. See docs/RELEASING.md"; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravyn-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/ravyn-release.jks" >> "$GITHUB_ENV"
      - name: Build signed universal APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(python - "$VERSION" <<'PY'
          import sys
          parts = sys.argv[1].split('.')
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit("Expected vMAJOR.MINOR.PATCH tag")
          major, minor, patch = map(int, parts)
          code = major * 1000000 + minor * 1000 + patch
          if code <= 0 or code > 2100000000:
              raise SystemExit("Android version code out of range")
          print(code)
          PY
          )"
          chmod +x gradlew
          ANDROID_VERSION_CODE="$CODE" ./gradlew :app:assembleRelease -PreleaseVersion="$VERSION" --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*universal*release*.apk' -print -quit)"
          test -n "$APK" || { echo "Universal release APK not found"; exit 1; }
          cp "$APK" "Ravyn-$GITHUB_REF_NAME.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Ravyn-$GITHUB_REF_NAME.apk" --title "Ravyn $GITHUB_REF_NAME" --generate-notes
