name: Signed Ravyn release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/android-release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v2.0.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Set up Android SDK
        run: |
          ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "Missing release signing secrets. See docs/RELEASING.md"; exit 1;
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ravyn-release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/ravyn-release.jks" >> "$GITHUB_ENV"
      - name: Build signed universal APK
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          CODE="$(python - "$VERSION" <<'PY'
          import sys
          parts = sys.argv[1].split('.')
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit("Expected vMAJOR.MINOR.PATCH tag")
          major, minor, patch = map(int, parts)
          code = major * 1000000 + minor * 1000 + patch
          if code <= 0 or code > 2100000000:
              raise SystemExit("Android version code out of range")
          print(code)
          PY
          )"
          chmod +x gradlew
          ANDROID_VERSION_CODE="$CODE" ./gradlew :app:assembleRelease -PreleaseVersion="$VERSION" --no-daemon --stacktrace
          echo "Produced APKs:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -ls
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release.apk' -print -quit)"
          fi
          test -n "$APK" || { echo "::error::No universal or combined release APK found"; exit 1; }
          for abi in arm64-v8a x86_64; do
            if ! unzip -Z -1 "$APK" | grep -q "^lib/$abi/"; then
              echo "::error::Selected APK is missing native libraries for $abi; refusing to publish a partial release"
              exit 1
            fi
          done
          cp "$APK" "Ravyn-$RELEASE_TAG.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "Ravyn-$RELEASE_TAG.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "Ravyn-$RELEASE_TAG.apk" --target "$GITHUB_SHA" --title "Ravyn $RELEASE_TAG — Playback & UI Fixes" --notes "## Ravyn v2.0.1

          A patch to the 2016-inspired Ravyn v2 interface.

          ### Playback
          - Add a single bounded recovery attempt if playback stays buffering for more than 25 seconds.
          - Log stream errors and HTTP response codes, including rate-limit responses, without aggressive retry loops.
          - Repair release-mode Logback configuration to make future playback faults easier to diagnose.

          ### Interface
          - Home carousels return to their first item when re-entering Home or loading new recommendations.
          - Enforce one-line titles across music cards.
          - Long-press songs for Play Next, Queue, playlists, and Don't Recommend.
          - Long-press recommended artists, albums, and playlists to hide them from Home.
          - Rebuild the lyrics reader with clearer text, song details, and synchronized scrolling.
          - Add an artist section on Now Playing with profile navigation.

          ### Notes
          This is a stability patch, not a change to the established Ravyn Classic design. Provider-side outages and rate limits cannot be fully prevented by the app."
          fi
